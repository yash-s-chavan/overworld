<!DOCTYPE html>

<html class="light" lang="en"><head>

<title>Playlist Creation</title>
<!-- Material Symbols -->

                    "surface-container-low": "#f4f3f1",

                    "surface-bright": "#faf9f6",
                    "inverse-surface": "#2f312f",
                    "surface-variant": "#e3e2e0",
                    "on-secondary-fixed-variant": "#0d503f",
                    "tertiary-fixed-dim": "#9ecede",
                    "on-error": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#2b5b69",
                    "on-surface": "#1a1c1a",
                    "tertiary": "#356572",
                    "primary": "#864e5a",
                    "on-error-container": "#93000a",
                    "surface-container": "#efeeeb",
                    "secondary-container": "#aeedd5",
                    "on-secondary": "#ffffff",
                    "background": "#faf9f6",
                    "on-tertiary-fixed-variant": "#1a4d5a",
                    "on-secondary-fixed": "#002118",
                    "on-background": "#1a1c1a",
                    "on-primary-fixed-variant": "#6b3743",
                    "on-surface-variant": "#514345",
                    "secondary-fixed": "#b1efd8",
                    "primary-container": "#ffb7c5",
                    "primary-fixed": "#ffd9df",
                    "outline-variant": "#d6c2c4",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#a2d2e2",
                    "surface": "#faf9f6",
                    "on-primary": "#ffffff",
                    "surface-container-high": "#e9e8e5",
                    "primary-fixed-dim": "#fbb3c1",
                    "surface-tint": "#864e5a",
                    "tertiary-fixed": "#baeafa",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#f2f1ee",

            "borderRadius": {

                    "xl": "3rem",

            "spacing": {

                    "gutter": "24px",
                    "base": "8px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Quicksand"],
                    "body-lg": ["Quicksand"],
                    "headline-md": ["Quicksand"],
                    "headline-lg": ["Quicksand"],
                    "label-sm": ["Quicksand"],
                    "body-md": ["Quicksand"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-sm": ["13px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: theme('colors.surface');
        }
        
        /* Neumorphic Utilities */
        .neu-pressed {
            box-shadow: inset 5px 5px 10px theme('colors.surface-dim'), inset -5px -5px 10px theme('colors.surface-container-lowest');
        }
        .neu-raised {
            box-shadow: 5px 5px 10px theme('colors.surface-dim'), -5px -5px 10px theme('colors.surface-container-lowest');
        }
        .neu-raised:active {
            box-shadow: inset 5px 5px 10px theme('colors.surface-dim'), inset -5px -5px 10px theme('colors.surface-container-lowest');
        }
        
        .neu-card {
            box-shadow: 10px 10px 20px theme('colors.surface-dim'), -10px -10px 20px theme('colors.surface-container-lowest');
        }
    </style>
</head>
<body class="font-body-md text-body-md text-on-surface antialiased overflow-x-hidden min-h-screen">
<!-- SideNavBar (Desktop) -->
<nav class="hidden md:flex fixed left-0 top-0 h-full py-8 px-6 h-screen w-72 flex-col shadow-[5px_5px_10px_#dbdad7,-5px_-5px_10px_#ffffff] dark:shadow-none bg-surface dark:bg-surface-dim z-40">
<div class="mb-12 flex items-center gap-4 px-4">
<div class="w-12 h-12 rounded-full overflow-hidden neu-pressed">
<img alt="Trainer Red" class="w-full h-full object-cover" data-alt="A stylized, flat-vector avatar illustration of a Pokemon trainer with a red hat, looking heroic but calm, set against a soft pastel background in a neumorphic, playful art style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqgugSbgrJq5A7sKZ4pzyPECKYYA7vFZ5CLoUCFU4rvKwEhq4oxy9jstsUQTJStfk4Oqg-0oXrZn2JiQhAeSFCekKUbm-yl0NctfPZDVVWO6VdbiMCEnFFBaZvAYTzbOwWmv_HGU0BUM55rYs0wHfp0By0GSdWuhqas1PHHiFKhOLtNTI4tofcT6vQBhNWSWmEkC3vjzAGHqGHXX9iw5nQRKxQY_RlAqAqFPvTpmqco82vDgF1UZfC"/>
</div>
<div>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">Trainer Red</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant">Elite Four Collector</p>
</div>
</div>
<ul class="flex-1 space-y-2">
<li>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="radar">radar</span>
<span class="font-body-lg text-body-lg">Live Radar</span>
</a>
</li>
<li>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-primary font-bold border-r-4 border-primary Active: scale-95 transition-transform duration-150 neu-pressed bg-surface-container-low" href="#">
<span class="material-symbols-outlined" data-icon="queue_music">queue_music</span>
<span class="font-body-lg text-body-lg">Playlists</span>
</a>
</li>
<li>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="pokedex">maps_ar</span>
<span class="font-body-lg text-body-lg">The Music Dex</span>
</a>
</li>
</ul>
</nav>
<!-- Main Content Canvas -->
<main class="md:ml-72 pb-32 md:pb-32 pt-8 px-margin-mobile md:px-margin-desktop min-h-screen flex items-center justify-center">
<!-- Playlist Creation Card -->
<div class="w-full max-w-2xl bg-surface rounded-xl p-8 md:p-12 neu-card relative overflow-hidden">
<!-- Subtle Inner Glow -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none rounded-xl" style="box-shadow: inset 2px 2px 5px rgba(255,255,255,0.8);"></div>
<header class="mb-10 text-center relative z-10">
<h2 class="font-headline-lg text-headline-lg text-primary mb-2">Create New Playlist</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Curate your perfect soundscape.</p>
</header>
<form class="space-y-8 relative z-10">
<!-- Title Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-4" for="playlist-title">Playlist Title</label>
<input class="w-full bg-surface text-on-surface font-body-lg text-body-lg px-6 py-4 rounded-full border-none focus:ring-0 neu-pressed transition-all placeholder:text-outline" id="playlist-title" placeholder="e.g., Indigo Plateau Chill" type="text"/>
</div>
<!-- Cover Image Upload Area -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-4">Cover Image</label>
<button class="w-full aspect-square md:aspect-video rounded-xl bg-surface flex flex-col items-center justify-center gap-4 group transition-all" style="border: 3px dashed theme('colors.outline-variant'); box-shadow: inset 5px 5px 10px theme('colors.surface-container-high'), inset -5px -5px 10px theme('colors.surface-container-lowest');" type="button">
<div class="w-16 h-16 rounded-full bg-surface flex items-center justify-center neu-raised group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="add_photo_alternate">add_photo_alternate</span>
</div>
<span class="font-body-md text-body-md text-primary font-bold">Add Cover Image</span>
<span class="font-label-sm text-label-sm text-on-surface-variant max-w-xs text-center">Tap to upload a soothing visual for your mix.</span>
</button>
</div>
<!-- Actions -->
<div class="pt-6 flex justify-end gap-4">
<button class="px-6 py-3 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" type="button">
                        Cancel
                    </button>
<button class="px-8 py-4 rounded-full bg-primary-container text-on-primary-container font-headline-md text-headline-md neu-raised hover:bg-inverse-primary transition-colors flex items-center gap-2" type="submit">
<span class="material-symbols-outlined" data-icon="save">save</span>
                        Save Playlist
                    </button>
</div>
</form>
</div>
</main>
<!-- BottomNavBar (Global Player) -->
<div class="fixed bottom-0 right-0 w-full md:w-[calc(100%-18rem)] z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop bg-surface dark:bg-surface-dim docked full-width bottom-0 h-24 rounded-t-lg shadow-[0px_-5px_10px_#dbdad7,0px_-5px_10px_#ffffff] dark:shadow-none">
<!-- Now Playing Info -->
<div class="flex items-center gap-4 flex-1">
<div class="w-14 h-14 rounded-lg overflow-hidden neu-raised">
<img alt="Album Art" class="w-full h-full object-cover" data-alt="A soft, abstract, pastel-colored geometric album cover art, featuring smooth intersecting circles in shades of pink, mint green, and pale yellow, in a clean neumorphic aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9UNr0XjtsOP0UGi38Wq6_jW4yqy23tbvaAofHqLJFExhdFZTtZOJPmQVJaySB-HpWrr0wG2PungsbsmiCQ8yY9x83u2d7ZIvBe_Rc-Wjlo3LZ0Zf2l_1kXiK949zA04_I2Mn_KGnMCtbH-UHz0MLMEsYvxRS_p9bgUs8RwgDDlwV2_CGFKyctaxjdfKeUAJHSDrRlmOM1pcnKzqt_4AFZjPJgcbbiuxXxZrEKAnY3fxFVD37Ux857"/>
</div>
<div class="hidden sm:block">
<p class="font-body-lg text-body-lg text-on-surface font-bold">Pallet Town Breeze</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Lofi Kanto</p>
</div>
</div>
<!-- Controls -->
<div class="flex items-center gap-6 md:gap-8 flex-1 justify-center">
<button class="text-on-surface-variant hover:text-secondary transition-all flex flex-col items-center justify-center p-2 neu-raised rounded-full w-10 h-10 active:shadow-inner active:scale-95">
<span class="material-symbols-outlined" data-icon="skip_previous">skip_previous</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl p-4 shadow-inner neu-raised w-16 h-16 active:shadow-inner active:scale-95 hover:text-secondary transition-all">
<span class="material-symbols-outlined text-3xl" data-icon="play_circle">play_circle</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-secondary transition-all neu-raised rounded-full w-10 h-10 active:shadow-inner active:scale-95">
<span class="material-symbols-outlined" data-icon="skip_next">skip_next</span>
</button>
</div>
<!-- Secondary Actions -->
<div class="flex items-center gap-4 flex-1 justify-end hidden md:flex">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-secondary transition-all neu-raised rounded-full w-10 h-10 active:shadow-inner active:scale-95">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-secondary transition-all neu-raised rounded-full w-10 h-10 active:shadow-inner active:scale-95">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</button>
</div>
<!-- Mobile Expand -->
<div class="flex items-center md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-secondary transition-all neu-raised rounded-full w-10 h-10 active:shadow-inner active:scale-95">
<span class="material-symbols-outlined" data-icon="expand_less">expand_less</span>
</button>
</div>
</div>
</body></html>
