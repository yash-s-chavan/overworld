<style>
        .neu-outer {
            box-shadow: 5px 5px 10px #dbdad7, -5px -5px 10px #ffffff;
        }
        .neu-inner {
            box-shadow: inset 5px 5px 10px #dbdad7, inset -5px -5px 10px #ffffff;
        }
        .neu-btn:active {
            box-shadow: inset 5px 5px 10px #dbdad7, inset -5px -5px 10px #ffffff;
        }
        .glass-highlight {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 100%);
            border-radius: inherit;
            pointer-events: none;
        }
    </style>

<body class="bg-surface text-on-surface font-body-md overflow-x-hidden">
<!-- Top App Bar (Mobile) -->
<header class="md:hidden bg-surface dark:bg-surface w-full top-0 px-margin-mobile py-4 flex justify-between items-center shadow-[5px_5px_10px_#dbdad7,-5px_-5px_10px_#ffffff] z-40 fixed">
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">
            Pokégear Audio
        </div>
<div class="flex gap-4">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary neu-outer active:neu-inner transition-all">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary neu-outer active:neu-inner transition-all">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- Top App Bar (Desktop) -->

<div class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed-dim">
            Pokégear Audio
        </div>
<div class="flex gap-4">
<button class="w-12 h-12 rounded-full flex items-center justify-center text-primary neu-outer hover:opacity-80 transition-opacity active:shadow-[inset_5px_5px_10px_#dbdad7,inset_-5px_-5px_10px_#ffffff]">
<span class="material-symbols-outlined text-2xl">settings</span>
</button>

<span class="material-symbols-outlined text-2xl">account_circle</span>
</button>
</div>
</header>
<div class="flex h-screen pt-20 md:pt-24 pb-32">

<div class="w-24 h-24 rounded-full neu-outer p-1 flex items-center justify-center bg-surface">

</div>
<button class="mt-4 px-6 py-2 rounded-full font-label-sm text-label-sm bg-primary text-on-primary shadow-[5px_5px_10px_#dbdad7,-5px_-5px_10px_#ffffff] hover:opacity-80 transition-all active:shadow-[inset_5px_5px_10px_#864e5a33]">
                    Sync Gear
                </button>
</div>
<nav class="flex flex-col gap-2 flex-grow relative">
<!-- Decorative carving line -->
<div class="absolute left-6 top-4 bottom-4 w-1 bg-surface-dim rounded-full neu-inner opacity-50 z-0"></div>
<button class="relative z-10 flex items-center gap-4 p-4 rounded-xl text-on-surface-variant font-body-lg text-body-lg hover:bg-surface-container-low transition-colors active:scale-95 duration-200 w-full text-left bg-surface">
<span class="material-symbols-outlined bg-surface rounded-full p-2 neu-outer">radar</span>
<span>Live Radar</span>
</button>
<button class="relative z-10 flex items-center gap-4 p-4 rounded-xl text-on-surface-variant font-body-lg text-body-lg hover:bg-surface-container-low transition-colors active:scale-95 duration-200 w-full text-left bg-surface">
<span class="material-symbols-outlined bg-surface rounded-full p-2 neu-outer">queue_music</span>
<span>Playlists</span>
</button>
<button class="relative z-10 flex items-center gap-4 p-4 rounded-xl text-secondary font-bold border-r-4 border-secondary bg-surface font-body-lg text-body-lg hover:bg-surface-container-low transition-colors active:scale-95 duration-200 w-full text-left">
<span class="material-symbols-outlined bg-surface rounded-full p-2 shadow-[inset_5px_5px_10px_#dbdad7,inset_-5px_-5px_10px_#ffffff] text-secondary">style</span>
<span>The Music Dex</span>
</button>

</aside>

<div class="max-w-4xl mx-auto flex flex-col gap-8 pb-12">

<div class="glass-highlight"></div>
<div class="w-full aspect-[16/9] rounded-lg overflow-hidden neu-inner relative">

</h1>

<div class="glass-highlight h-full"></div>
</div>
</div>
<div class="flex items-center justify-between mt-4">
<span class="font-body-lg text-body-lg text-on-surface-variant flex items-center gap-2">

<span class="font-headline-md text-headline-md text-primary-container text-opacity-80">210</span>
</div>

</div>

</div>
</div>

<div class="flex items-center justify-center h-full px-margin-mobile gap-8 pb-4 pt-2">

<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 w-16 h-16 rounded-full text-on-surface-variant shadow-[5px_5px_10px_#dbdad7,-5px_-5px_10px_#ffffff] hover:shadow-none transition-all active:shadow-[inset_5px_5px_10px_#dbdad7,inset_-5px_-5px_10px_#ffffff] duration-150">
<span class="material-symbols-outlined text-3xl">skip_next</span>
</button>
</div>
</nav>

<div class="flex items-center justify-center gap-8 w-full max-w-2xl mx-auto">

<span class="material-symbols-outlined text-3xl">skip_previous</span>
</button>
<button class="flex items-center justify-center w-20 h-20 rounded-full bg-primary-container text-on-primary-container shadow-[inset_5px_5px_10px_#864e5a33] transition-all hover:shadow-none active:shadow-[inset_5px_5px_10px_#dbdad7,inset_-5px_-5px_10px_#ffffff] duration-150">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="flex items-center justify-center w-16 h-16 rounded-full text-on-surface-variant shadow-[5px_5px_10px_#dbdad7,-5px_-5px_10px_#ffffff] hover:shadow-none transition-all active:shadow-[inset_5px_5px_10px_#dbdad7,inset_-5px_-5px_10px_#ffffff] duration-150">

</button>
